<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d24">
  <title>Um cantinho sob a lua</title>
  <style>
    :root { color-scheme: dark; --night:#080d24; --lav:#c9c8f3; --muted:#aeb4d1; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; }
    body {
      min-height:100vh; overflow-x:hidden; display:grid; place-items:center;
      padding:30px 18px; color:#f4f2ff;
      background: radial-gradient(ellipse at 50% 0%, #202653 0%, #101735 38%, var(--night) 78%);
      font-family: Georgia, "Times New Roman", serif;
    }
    .sky { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
    .star {
      position:absolute; width:2px; height:2px; border-radius:50%; background:#e9e8ff;
      opacity:.35; box-shadow:0 0 8px 2px #b9c7ff; animation: twinkle 4.8s ease-in-out infinite;
    }
    .star:nth-child(3n) { animation-delay:-2s; }
    .star:nth-child(4n) { width:3px; height:3px; animation-duration:6s; }
    @keyframes twinkle { 0%,100% { opacity:.18; transform:scale(.8); } 50% { opacity:.8; transform:scale(1.35); } }
    main { width:min(100%, 980px); position:relative; z-index:1; text-align:center; }
    .eyebrow { margin:0 0 10px; color:#b9bfdf; font:11px/1.5 system-ui,sans-serif; letter-spacing:.24em; text-transform:uppercase; }
    h1 { margin:0 0 20px; font-size:clamp(27px,5vw,43px); font-weight:400; letter-spacing:.02em; }
    .frame {
      position:relative; overflow:hidden; border:1px solid rgba(206,211,255,.19);
      border-radius:10px; background:#101735; box-shadow:0 24px 90px rgba(0,0,0,.42);
    }
    .frame img {
      display:block; width:100%; height:auto; aspect-ratio: 4 / 3; object-fit:cover;
      animation: breathe 24s ease-in-out infinite alternate; transform-origin:center;
      image-rendering:pixelated;
    }
    @keyframes breathe { from { transform:scale(1.005) translateY(0); } to { transform:scale(1.045) translateY(-.35%); } }
    .reflection {
      position:absolute; left:20%; right:20%; bottom:7%; height:12%;
      background:linear-gradient(90deg,transparent,rgba(187,195,255,.12),transparent);
      filter:blur(13px); animation: shimmer 7s ease-in-out infinite alternate; pointer-events:none;
    }
    @keyframes shimmer { from { opacity:.25; transform:translateX(-8%); } to { opacity:.75; transform:translateX(8%); } }
    .note { margin:18px auto 0; max-width:540px; color:#c2c6df; font-size:16px; line-height:1.7; }
    .music { margin:22px auto 0; width:min(100%,430px); padding:15px 16px 12px; border:1px solid rgba(206,211,255,.16);
      border-radius:10px; background:rgba(15,22,49,.72); }
    .music-label { margin:0 0 10px; color:#e4e4f7; font:12px system-ui,sans-serif; letter-spacing:.08em; }
    iframe { display:block; width:100%; height:80px; border:0; border-radius:7px; }
    .small { margin:10px 0 0; color:#8f98bb; font:11px system-ui,sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true" id="sky"></div>
  <main>
    <p class="eyebrow">um lugar tranquilo, só nosso</p>
    <h1>Debaixo da mesma lua</h1>
    <section class="frame" aria-label="Ilustração pixelada de um casal abraçado diante de um lago sob a lua">
      <img src="assets/voces-sob-a-lua.jpg" alt="Casal abraçado à beira de um lago, sob uma lua cheia e um céu estrelado, em pixel art">
      <span class="reflection"></span>
    </section>
    <p class="note">Que, por alguns instantes, o mundo fique quietinho.<br>Que a gente encontre paz no abraço um do outro.</p>
    <section class="music" aria-label="Música">
      <p class="music-label">♫ PARA OUVIR COM A GENTE</p>
      <iframe
        src="https://www.youtube-nocookie.com/embed/vGJTaP6anOU?rel=0"
        title="Elvis Presley — Can't Help Falling In Love (áudio oficial)"
        loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
      </iframe>
      <p class="small">Elvis Presley · Can't Help Falling In Love</p>
    </section>
  </main>
  <script>
    // Pequenas estrelas discretas, com brilho lento.
    const sky = document.getElementById('sky');
    let seed = 17;
    const random = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let i = 0; i < 54; i++) {
      const star = document.createElement('i');
      star.className = 'star';
      star.style.left = (random() * 100) + '%';
      star.style.top = (random() * 100) + '%';
      star.style.animationDelay = (-random() * 6) + 's';
      sky.appendChild(star);
    }
  </script>
</body>
</html>
